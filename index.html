    <title>Bondhu Chol - Study Forum of Jadavpur University</title>
    
    <!-- Fix for 404 on refresh - SPA redirect script -->
    <script>
      (function() {
        // Save the current path for SPA routing
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
